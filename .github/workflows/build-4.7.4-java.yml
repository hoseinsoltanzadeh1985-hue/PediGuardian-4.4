name: Build PediGuardian Java 4.7.4

on:
  push:
    paths:
      - 'PediGuardianJava/patches/build-4.7.4.py'
      - '.github/workflows/build-4.7.4-java.yml'
  pull_request:
    paths:
      - 'PediGuardianJava/patches/build-4.7.4.py'
      - '.github/workflows/build-4.7.4-java.yml'
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping 4.7.4 runs from publishing the same binary concurrently.
concurrency:
  group: pedi-guardian-4.7.4-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify and extract repository-pinned 4.7.1 source
        shell: bash
        run: |
          set -euo pipefail
          source_archive='PediGuardianJava/source/PediGuardianJava-4.7.1-source.zip'
          test -s "$source_archive"
          cp "$source_archive" source.zip
          echo '688d4ab294b99674b238ed5c6268e6be89ff3432de131525d77c6d2dadc83078  source.zip' | sha256sum -c -
          rm -rf source_bundle
          mkdir -p source_bundle
          unzip -q source.zip -d source_bundle
          test -f source_bundle/PediGuardianJava/source/pom.xml
          rm -rf PediGuardianJava/source
          cp -a source_bundle/PediGuardianJava/source PediGuardianJava/source
          cp source.zip PediGuardianJava/source/PediGuardianJava-4.7.1-source.zip
          rm -f source.zip
          rm -rf source_bundle
          test -f PediGuardianJava/source/pom.xml

      - name: Apply deterministic 4.7.4 patch
        shell: bash
        run: |
          set -euo pipefail
          cd PediGuardianJava
          python3 patches/build-4.7.4.py
          test -f source/src/main/java/ir/pedirany/guardian/ai/AiService.java
          test -f source/src/main/java/ir/pedirany/guardian/telegram/TelegramClient.java
          test -f source/src/main/java/ir/pedirany/guardian/games/GameCenter.java

      - name: Compile Java 21
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          cd PediGuardianJava/source
          rm -rf target && mkdir -p target/classes
          javac --release 21 -d target/classes $(find src/main/java -name '*.java' | sort)
          if [ -d src/main/resources ]; then cp -R src/main/resources/. target/classes/; fi
          jar cfe target/pedi-guardian-java-4.7.4.jar ir.pedirany.guardian.Main -C target/classes .
          sha256sum target/pedi-guardian-java-4.7.4.jar | tee target/pedi-guardian-java-4.7.4.jar.sha256

      - name: Regression assertions
        shell: bash
        run: |
          set -euo pipefail
          cd PediGuardianJava/source
          grep -F 'MAX_TURNS' src/main/java/ir/pedirany/guardian/ai/AiService.java
          grep -F 'MAX_CONTEXT_CHARS' src/main/java/ir/pedirany/guardian/ai/AiService.java
          grep -F 'ai.ask(c.chatId(),c.userId(),p)' src/main/java/ir/pedirany/guardian/commands/handlers/FeatureHandler.java
          grep -F 'MODERN_ALLOWED_UPDATES' src/main/java/ir/pedirany/guardian/telegram/TelegramClient.java
          grep -F 'stopped_message_generation' src/main/java/ir/pedirany/guardian/telegram/TelegramClient.java
          grep -F 'singleButton' src/main/java/ir/pedirany/guardian/games/GameCenter.java
          grep -F 'retro-flight.html' src/main/java/ir/pedirany/guardian/games/GameCenter.java
          grep -F 'backgammon.html' src/main/java/ir/pedirany/guardian/games/GameCenter.java
          grep -F 'statusCode()==409' src/main/java/ir/pedirany/guardian/voice/VoiceOrderQueue.java
          timeout 5 java -jar target/pedi-guardian-java-4.7.4.jar 2>&1 | grep -F 'BOT_TOKEN' || true

      - name: Publish verified release artifact to repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          artifact_source='PediGuardianJava/source/target/pedi-guardian-java-4.7.4.jar'
          artifact_target='PediGuardianJava/release/pedi-guardian-java-4.7.4.jar'
          test -s "$artifact_source"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Never rebase two binary JAR commits. Refresh the branch, then stage
          # the freshly built artifact on top of the newest remote commit.
          for attempt in 1 2 3 4 5; do
            git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p "$(dirname "$artifact_target")"
            cp "$artifact_source" "$artifact_target"
            git add "$artifact_target"

            if git diff --cached --quiet; then
              echo '4.7.4 artifact already synchronized with the remote branch.'
              exit 0
            fi

            git commit -m 'release: publish PediGuardian Java 4.7.4'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo '4.7.4 artifact published successfully.'
              exit 0
            fi

            echo "Remote branch advanced during publish; refreshing and retrying ($attempt/5)." >&2
          done

          echo 'Unable to publish 4.7.4 artifact after five fast-forward attempts.' >&2
          exit 1
