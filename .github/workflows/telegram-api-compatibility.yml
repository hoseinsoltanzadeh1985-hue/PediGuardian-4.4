name: Telegram API Compatibility

on:
  push:
    branches: ["main", "release/**", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  documentation-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check methods against official Telegram Bot API documentation
        run: python scripts/check_telegram_api_compat.py

  live-bot-smoke:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Telegram bot identity and webhook registration
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: python scripts/telegram_live_smoke.py
      - name: Report skipped live check when no token is configured
        if: ${{ env.TELEGRAM_BOT_TOKEN == '' }}
        run: echo "TELEGRAM_BOT_TOKEN is not configured; live smoke test skipped."
