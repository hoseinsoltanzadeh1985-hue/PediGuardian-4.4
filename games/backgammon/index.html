<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Simorgh Backgammon</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#2e2638,#090a10 65%);color:#fff;font-family:system-ui}.wrap{max-width:760px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill,button{background:#ffffff12;color:#fff;border:1px solid #ffffff24;border-radius:12px;padding:9px 12px;font-weight:900}.board{margin:12px auto;max-width:680px;aspect-ratio:1.05;background:linear-gradient(90deg,#4d2518,#8a5a31 50%,#4d2518);border:8px solid #24130f;border-radius:20px;padding:8px;display:grid;grid-template-columns:1fr 44px 1fr;gap:6px;box-shadow:0 18px 60px #0009}.half{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}.point{position:relative;display:flex;cursor:pointer}.tophalf .point{align-items:flex-start}.bottomhalf .point{align-items:flex-end}.tri{width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:170px solid #3b1915}.bottomhalf .tri{border-top:0;border-bottom:170px solid #311416}.point:nth-child(even) .tri{border-left-color:#c38b58;border-right-color:#c38b58;border-top-color:#c38b58}.bottomhalf .point:nth-child(even) .tri{border-bottom-color:#c38b58}.checkers{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;top:10px}.bottomhalf .checkers{top:auto;bottom:10px;flex-direction:column-reverse}.checker{width:31px;height:31px;border-radius:50%;border:2px solid #0007;box-shadow:0 3px 7px #0009}.white{background:#f4ead0}.black{background:#17181d}.mid{background:#1a100f;border-radius:10px}.status{text-align:center;min-height:28px}.dice{font-size:24px;margin:5px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.msg{margin:8px;text-align:center;opacity:.9}.selected{outline:3px solid #fff8;border-radius:50%}@media(max-width:540px){.board{border-width:5px;grid-template-columns:1fr 24px 1fr}.tri{border-left-width:15px;border-right-width:15px;border-top-width:125px}.bottomhalf .tri{border-bottom-width:125px}.checker{width:24px;height:24px}.checkers{top:6px}.bottomhalf .checkers{bottom:6px}}</style></head><body><div class="wrap"><div class="top"><div class="pill">🎲 تخته نرد</div><div class="pill" id="turn">نوبت شما</div></div><div class="status"><div id="dice" class="dice">—</div><div id="msg" class="msg">ابتدا تاس بیندازید.</div></div><div class="actions"><button id="roll">🎲 تاس</button><button id="new">🔄 بازی جدید</button></div><div class="board"><div id="top" class="half tophalf"></div><div class="mid"></div><div id="bottom" class="half bottomhalf"></div></div><div class="status">⚪ خارج‌شده: <b id="offw">0</b> · ⚫ خارج‌شده: <b id="offb">0</b></div></div><script>(()=>{const INIT=[2,0,0,0,0,-5,0,-3,0,0,0,5,-5,0,0,0,3,5,0,0,0,0,0,-2];let p=[...INIT],offw=0,offb=0,barw=0,barb=0,turn='w',dice=[],sel=-1,over=false;const $=id=>document.getElementById(id);function die(){return 1+Math.floor(Math.random()*6)}function roll(){if(over||turn!=='w'||dice.length)return;const a=die(),b=die();dice=a===b?[a,a,a,a]:[a,b];draw()}function home(c){if(c==='w'){if(barw)return false;for(let i=0;i<18;i++)if(p[i]>0)return false}else{if(barb)return false;for(let i=6;i<24;i++)if(p[i]<0)return false}return true}function dest(i,d,c){return c==='w'?i+d:i-d}function open(t,c){return t>=0&&t<24&&(c==='w'?p[t]>=-1:p[t]<=1)}function legal(i,c){if(c==='w'&&barw&&i!==-1)return false;if(c==='b'&&barb&&i!==-1)return false;return dice.some(d=>{const t=dest(i,d,c);return (t>=0&&t<24&&open(t,c))||(home(c)&&((c==='w'&&t>=24)||(c==='b'&&t<0)))})}function move(from,to,d,c){if(c==='w'&&barw){barw--;from=-1}else if(c==='b'&&barb){barb--;from=-1}if(from>=0)p[from]+=c==='w'?-1:1;if(to<0||to>23){if(c==='w')offw++;else offb++}else if(c==='w'){if(p[to]===-1){p[to]=1;barb++}else p[to]++}else{if(p[to]===1){p[to]=-1;barw++}else p[to]--}const idx=dice.indexOf(d);if(idx>=0)dice.splice(idx,1)}function chooseAI(){if(over)return;const a=die(),b=die();let ds=a===b?[a,a,a,a]:[a,b];while(ds.length){let opts=[];if(barb>0){for(const d of ds){const t=23-d;if(t>=0&&open(t,'b'))opts.push({from:-1,to:t,d})}}else{for(let i=0;i<24;i++)if(p[i]<0)for(const d of ds){const t=dest(i,d,'b');if((t>=0&&t<24&&open(t,'b'))||(home('b')&&t<0))opts.push({from:i,to:t,d})}}if(!opts.length)break;const m=opts[Math.floor(Math.random()*opts.length)];move(m.from,m.to,m.d,'b');ds.splice(ds.indexOf(m.d),1)}dice=[];turn='w';if(offb>=15){over=true;$("msg").textContent='⚫ هوش مصنوعی برنده شد.'}draw()}function clickPoint(i){if(over||turn!=='w'||!dice.length)return;if(barw>0){for(const d of dice){const t=d-1;if(i===t&&open(t,'w')){move(-1,t,d,'w');if(!dice.length){turn='b';draw();setTimeout(chooseAI,350)}else draw();return}}return}if(sel<0){if(p[i]>0&&legal(i,'w')){sel=i;draw()}return}for(const d of dice){const t=dest(sel,d,'w');if(t===i&&open(t,'w')){move(sel,t,d,'w');sel=-1;if(offw>=15){over=true;$("msg").textContent='⚪ شما برنده شدید.';draw();return}if(!dice.length){turn='b';draw();setTimeout(chooseAI,350)}else draw();return}}sel=-1;draw()}function point(i){const el=document.createElement('div');el.className='point';el.onclick=()=>clickPoint(i);const tri=document.createElement('div');tri.className='tri';el.appendChild(tri);const cs=document.createElement('div');cs.className='checkers';const v=p[i],n=Math.min(5,Math.abs(v));for(let k=0;k<n;k++){const c=document.createElement('div');c.className='checker '+(v>0?'white':'black');cs.appendChild(c)}if(sel===i)cs.classList.add('selected');el.appendChild(cs);return el}function draw(){const top=$("top"),bottom=$("bottom");top.innerHTML='';bottom.innerHTML='';for(let s=0;s<12;s++){const ti=s<6?23-s:s-6,bi=s<6?s:17-(s-6);top.appendChild(point(ti));bottom.appendChild(point(bi))}$("dice").textContent=dice.length?dice.join('  '):'—';$("turn").textContent=over?'پایان بازی':turn==='w'?'نوبت شما':'نوبت هوش مصنوعی';$("offw").textContent=offw;$("offb").textContent=offb;if(!over)$("msg").textContent=turn==='w'?(dice.length?'مهره را انتخاب کنید.':'تاس بیندازید.'):'در حال محاسبه...'}$("roll").onclick=roll;$("new").onclick=()=>{p=[...INIT];offw=offb=barw=barb=0;turn='w';dice=[];sel=-1;over=false;draw()};draw()})();</script></body></html>
