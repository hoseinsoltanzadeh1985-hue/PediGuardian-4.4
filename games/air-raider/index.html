<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Simorgh Air Raider</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071521;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:8px;left:8px;right:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:2}.pill{background:#03111add;border:1px solid #ffffff2a;border-radius:12px;padding:7px;font-weight:900;text-align:center;font-size:12px}.controls{position:fixed;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}.pad,.fires{pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,44px);gap:6px}.ctl,.fire,.again{background:#071a28ee;color:#fff;border:1px solid #ffffff2a;border-radius:14px;min-height:44px;font-weight:900}.up{grid-column:2}.down{grid-column:2}.fires{display:flex;gap:8px}.fire{width:66px;border-radius:50%}.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:8;place-items:center}.overlay.show{display:grid}.card{width:min(90vw,420px);background:#091724f7;border:1px solid #ffffff22;border-radius:24px;padding:24px;text-align:center}.card button{padding:12px 22px}.small{opacity:.78}@media(min-width:800px){.pill{font-size:14px}.hud{max-width:720px;left:50%;right:auto;transform:translateX(-50%);width:calc(100vw - 20px)}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">امتیاز <b id="score">0</b></div><div class="pill">مرحله <b id="level">1</b></div><div class="pill">جان <b id="life">3</b></div><div class="pill">سوخت <b id="fuel">100</b></div></div><div class="controls"><div class="pad"><button class="ctl up" data-k="u">▲</button><button class="ctl" data-k="l">◀</button><button class="ctl" data-k="r">▶</button><button class="ctl down" data-k="d">▼</button></div><div class="fires"><button id="shot" class="fire">🔥</button><button id="bomb" class="fire">💣</button></div></div><div id="overlay" class="overlay"><div class="card"><h2>✈️ بازی تمام شد</h2><p>امتیاز نهایی: <b id="final">0</b></p><p class="small">حرکت با دکمه‌ها یا لمس صفحه · شلیک با 🔥 · بمب با 💣</p><button id="again" class="again">شروع دوباره</button></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');const ui={score:document.getElementById('score'),level:document.getElementById('level'),life:document.getElementById('life'),fuel:document.getElementById('fuel'),ov:document.getElementById('overlay'),final:document.getElementById('final')};let W=innerWidth,H=innerHeight,scale=1,last=performance.now(),raf=0,st,player,enemy=[],fuel=[],shots=[],keys={l:0,r:0,u:0,d:0},pointer={on:false,x:.5,y:.8};function resize(){W=innerWidth;H=innerHeight;scale=Math.min(2,devicePixelRatio||1);c.width=W*scale;c.height=H*scale;x.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',resize);resize();function reset(){cancelAnimationFrame(raf);st={score:0,level:1,life:3,fuel:100,time:0,bombs:2,over:false};player={x:.5,y:.8};enemy=[];fuel=[];shots=[];ui.ov.classList.remove('show');last=performance.now();raf=requestAnimationFrame(loop)}function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2}function spawn(){const cx=.5+.12*Math.sin(st.time*.0012);const e={x:Math.max(.06,Math.min(.94,cx+(Math.random()-.5)*.4)),y:-.08,w:.05,h:.06,v:.06+st.level*.008,hp:Math.random()<.18?2:1};enemy.push(e);if(Math.random()<.18)fuel.push({x:e.x,y:-.14,w:.03,h:.03,v:.045})}function shoot(){if(!st.over)shots.push({x:player.x,y:player.y-.06,v:.95})}function bomb(){if(st.over||st.bombs<=0)return;st.bombs--;st.score+=enemy.reduce((n,e)=>n+e.hp*80,0);enemy.length=0}function gameover(){st.over=true;ui.final.textContent=st.score;ui.ov.classList.add('show')}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#4c9547';x.fillRect(0,0,W,H);const center=.5+.11*Math.sin(st.time*.0016);x.fillStyle='#0b6c89';x.beginPath();x.moveTo(0,0);for(let y=0;y<=H;y+=14)x.lineTo(center*W-W*.22+Math.sin(y*.004+st.time*.001)*W*.05,y);for(let y=H;y>=0;y-=14)x.lineTo(center*W+W*.22+Math.sin(y*.004+st.time*.001)*W*.05,y);x.closePath();x.fill();for(const f of fuel){x.fillStyle='#ffdc50';x.fillRect(f.x*W-8,f.y*H-8,16,16);x.fillStyle='#5b4310';x.fillRect(f.x*W-4,f.y*H-3,8,6)}for(const e of enemy){x.fillStyle='#9b2430';x.beginPath();x.moveTo(e.x*W,e.y*H-18);x.lineTo(e.x*W-15,e.y*H+13);x.lineTo(e.x*W,e.y*H+6);x.lineTo(e.x*W+15,e.y*H+13);x.closePath();x.fill()}x.fillStyle='#fff4b0';for(const s of shots)x.fillRect(s.x*W-2,s.y*H-8,4,16);x.save();x.translate(player.x*W,player.y*H);x.fillStyle='#e8f5ff';x.beginPath();x.moveTo(0,-24);x.lineTo(-17,17);x.lineTo(0,10);x.lineTo(17,17);x.closePath();x.fill();x.restore()}function loop(now){if(st.over)return;const dt=Math.min(40,now-last);last=now;st.time+=dt;st.fuel-=dt*.002;st.level=1+Math.floor(st.score/1200);if(st.fuel<=0){st.fuel=100;st.life--;if(st.life<=0){gameover();return}}if(Math.random()<.018)spawn();player.x=Math.max(.06,Math.min(.94,player.x+(keys.r-keys.l)*dt*.0009));player.y=Math.max(.12,Math.min(.9,player.y+(keys.d-keys.u)*dt*.0009));if(pointer.on){player.x+=(pointer.x-player.x)*.12;player.y+=(pointer.y-player.y)*.12}for(const e of enemy)e.y+=e.v*dt/16;for(const f of fuel)f.y+=f.v*dt/16;for(const s of shots)s.y-=s.v*dt/16;for(let i=enemy.length-1;i>=0;i--){const e=enemy[i];if(hit({x:player.x,y:player.y,w:.04,h:.06},e)){enemy.splice(i,1);st.life--;if(st.life<=0){gameover();return}}else if(e.y>1.1){enemy.splice(i,1);st.life--;if(st.life<=0){gameover();return}}}for(let i=fuel.length-1;i>=0;i--)if(hit({x:player.x,y:player.y,w:.04,h:.06},fuel[i])){fuel.splice(i,1);st.fuel=Math.min(100,st.fuel+35);st.score+=50}else if(fuel[i]&&fuel[i].y>1.1)fuel.splice(i,1);for(let i=shots.length-1;i>=0;i--){if(shots[i].y<-.1){shots.splice(i,1);continue}for(let j=enemy.length-1;j>=0;j--)if(hit({x:shots[i].x,y:shots[i].y,w:.01,h:.02},enemy[j])){enemy[j].hp--;shots.splice(i,1);if(enemy[j]?.hp<=0){st.score+=120;enemy.splice(j,1)}break}}st.score+=Math.floor(dt/250);ui.score.textContent=st.score;ui.level.textContent=st.level;ui.life.textContent=st.life;ui.fuel.textContent=Math.round(st.fuel);draw();raf=requestAnimationFrame(loop)}document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=()=>keys[k]=1;b.onpointerup=b.onpointercancel=()=>keys[k]=0});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key==='ArrowUp')keys.u=1;if(e.key==='ArrowDown')keys.d=1;if(e.code==='Space')shoot()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0;if(e.key==='ArrowUp')keys.u=0;if(e.key==='ArrowDown')keys.d=0});c.onpointerdown=e=>{pointer.on=true;pointer.x=e.clientX/W;pointer.y=e.clientY/H};c.onpointermove=e=>{if(pointer.on){pointer.x=e.clientX/W;pointer.y=e.clientY/H}};addEventListener('pointerup',()=>pointer.on=false);document.getElementById('shot').onclick=shoot;document.getElementById('bomb').onclick=bomb;document.getElementById('again').onclick=reset;reset()})();</script></body></html>
